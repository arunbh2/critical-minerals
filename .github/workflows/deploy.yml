name: Build, check and deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; Pages write and OIDC are granted only to the deploy job.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Validate, test and check build output
    runs-on: ubuntu-latest
    env:
      # Project-site address for checks; the deploy build uses the values Pages reports.
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Content and reference validation
        run: npm run validate
      - name: Unit tests (status logic, worksheet export, contrast)
        run: npm test
      - name: Production build and search index
        run: npm run build
      - name: Check build output (links, assets, private material)
        env:
          # Private list of restricted phrases (one per line), kept out of the public repo.
          RESTRICTED_TERMS: ${{ secrets.RESTRICTED_TERMS }}
        run: npm run check:dist
      - name: Install browser for journey tests
        run: npx playwright install --with-deps chromium
      - name: Browser journeys under the repository path
        run: npm run test:e2e

  build:
    name: Build for the served address
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Pages origin and base path
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Production build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Check build output for the served address
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          RESTRICTED_TERMS: ${{ secrets.RESTRICTED_TERMS }}
          # Refuse to deploy if the private restricted-term list is missing.
          REQUIRE_RESTRICTED_TERMS: '1'
        run: npm run check:dist
      - name: Upload static output
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
